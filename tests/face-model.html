<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Face and pose model smoke test</title>
<body>
<pre id="result">Loading face and pose models (no camera access)...</pre>
<canvas id="frame" width="320" height="240" hidden></canvas>
<script type="module">
  import { FaceLandmarker, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";
  const output = document.querySelector("#result");
  let faceLandmarker, poseLandmarker;
  try {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "CPU",
      },
      runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true,
    });
    const frame = document.querySelector("#frame");
    const ctx = frame.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, frame.width, frame.height);
    const result = faceLandmarker.detectForVideo(frame, performance.now());
    if (!Array.isArray(result.faceBlendshapes) || result.faceBlendshapes.length !== 0) throw new Error("Blank frame should have no face blendshapes");
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task",
        delegate: "CPU",
      },
      runningMode: "VIDEO", numPoses: 1,
    });
    const pose = poseLandmarker.detectForVideo(frame, performance.now());
    if (!Array.isArray(pose.landmarks) || pose.landmarks.length !== 0) throw new Error("Blank frame should have no poses");
    output.textContent = "PASS: real FaceLandmarker blendshapes and PoseLandmarker models loaded and processed a blank frame. No camera used.";
  } catch (error) {
    output.textContent = `FAIL: ${error.message}`;
  } finally {
    faceLandmarker?.close();
    poseLandmarker?.close();
  }
</script>
</body>
</html>
