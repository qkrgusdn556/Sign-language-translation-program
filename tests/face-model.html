<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Face model smoke test</title>
<body>
<pre id="result">Loading face model (no camera access)...</pre>
<canvas id="frame" width="320" height="240" hidden></canvas>
<script type="module">
  import { FaceDetector, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";
  const output = document.querySelector("#result");
  let detector, poseLandmarker;
  try {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate: "CPU",
      },
      runningMode: "VIDEO", minDetectionConfidence: 0.6,
    });
    const frame = document.querySelector("#frame");
    const ctx = frame.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, frame.width, frame.height);
    const result = detector.detectForVideo(frame, performance.now());
    if (!Array.isArray(result.detections) || result.detections.length !== 0) throw new Error("Blank frame should have no faces");
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "CPU",
      },
      runningMode: "VIDEO", numPoses: 1,
    });
    const pose = poseLandmarker.detectForVideo(frame, performance.now());
    if (!Array.isArray(pose.landmarks) || pose.landmarks.length !== 0) throw new Error("Blank frame should have no poses");
    output.textContent = "PASS: real FaceDetector and PoseLandmarker models loaded and processed a blank frame. No camera used.";
  } catch (error) {
    output.textContent = `FAIL: ${error.message}`;
  } finally {
    detector?.close();
    poseLandmarker?.close();
  }
</script>
</body>
</html>
